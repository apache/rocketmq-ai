<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#ffffff"/>

  <!-- title -->
  <text x="480" y="36" text-anchor="middle" fill="#111827" font-size="16" font-weight="600">A2A Standard View — Event Replication across Server Instances</text>
  <text x="480" y="60" text-anchor="middle" fill="#6b7280" font-size="12">Replicates task state events from any instance to the mirror queues of other instances</text>

  <!-- external clients -->
  <rect x="70" y="140" width="270" height="44" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="205" y="159" text-anchor="middle" fill="#111827" font-size="13" font-weight="600">Client A</text>
  <text x="205" y="175" text-anchor="middle" fill="#6b7280" font-size="11">updates task-1</text>
  <rect x="620" y="140" width="270" height="44" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="755" y="159" text-anchor="middle" fill="#111827" font-size="13" font-weight="600">Client B</text>
  <text x="755" y="175" text-anchor="middle" fill="#6b7280" font-size="11">stream of task-1 open</text>

  <!-- instance containers -->
  <rect x="70" y="200" width="270" height="230" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,4" data-graph-role="container"/>
  <text x="80" y="222" fill="#374151" font-size="12" font-weight="600">Server Instance A</text>
  <rect x="620" y="200" width="270" height="230" rx="8" fill="none" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,4" data-graph-role="container"/>
  <text x="630" y="222" fill="#374151" font-size="12" font-weight="600">Server Instance B</text>

  <!-- instance A nodes -->
  <rect x="95" y="250" width="220" height="50" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="205" y="272" text-anchor="middle" fill="#111827" font-size="13" font-weight="600">EventQueue · task-1</text>
  <text x="205" y="289" text-anchor="middle" fill="#6b7280" font-size="11">local enqueue</text>
  <rect x="95" y="330" width="220" height="50" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="205" y="352" text-anchor="middle" fill="#111827" font-size="13" font-weight="600">TaskStore · task-1</text>
  <text x="205" y="369" text-anchor="middle" fill="#6b7280" font-size="11">shared task state</text>

  <!-- instance B nodes -->
  <rect x="645" y="250" width="220" height="50" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="755" y="272" text-anchor="middle" fill="#111827" font-size="13" font-weight="600">mirror EventQueue · task-1</text>
  <text x="755" y="289" text-anchor="middle" fill="#6b7280" font-size="11">receives replicated events</text>
  <rect x="645" y="330" width="220" height="50" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="755" y="352" text-anchor="middle" fill="#111827" font-size="13" font-weight="600">TaskStore · task-1</text>
  <text x="755" y="369" text-anchor="middle" fill="#6b7280" font-size="11">shared task state</text>

  <!-- replication channel -->
  <rect x="405" y="140" width="150" height="290" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" data-graph-role="container"/>
  <text x="480" y="254" text-anchor="middle" fill="#111827" font-size="13" font-weight="600">Event Replication</text>
  <text x="480" y="272" text-anchor="middle" fill="#111827" font-size="13" font-weight="600">Channel</text>
  <text x="480" y="294" text-anchor="middle" fill="#6b7280" font-size="11">ReplicationStrategy</text>
  <text x="480" y="310" text-anchor="middle" fill="#6b7280" font-size="11">(A2A SDK extension)</text>

  <!-- arrows -->
  <line x1="220" y1="184" x2="220" y2="242" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="230" y="196" fill="#9ca3af" font-size="12">① updates task-1</text>
  <line x1="315" y1="275" x2="398" y2="275" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="356" y="269" text-anchor="middle" fill="#4b5563" font-size="12">② replicates</text>
  <line x1="562" y1="275" x2="638" y2="275" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="600" y="269" text-anchor="middle" fill="#4b5563" font-size="12">③ delivers</text>
  <line x1="755" y1="184" x2="755" y2="232" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="765" y="196" fill="#9ca3af" font-size="12">④ opens stream</text>
  <line x1="620" y1="355" x2="562" y2="355" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="588" y="349" text-anchor="middle" fill="#4b5563" font-size="12">subscribes</text>
  <line x1="340" y1="410" x2="612" y2="410" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <text x="476" y="404" text-anchor="middle" fill="#dc2626" font-size="12">⑤ QueueClosedEvent (poison pill) → B stops</text>

  <!-- key points -->
  <rect x="70" y="480" width="820" height="56" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="90" y="502" fill="#4b5563" font-size="12">• Any instance's state change → replicated to other instances' mirror queues</text>
  <text x="90" y="520" fill="#4b5563" font-size="12">• Final state → QueueClosedEvent tells others to stop following</text>

  <!-- legend -->
  <line x1="120" y1="570" x2="150" y2="570" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="156" y="574" fill="#6b7280" font-size="12">state event replication</text>
  <line x1="320" y1="570" x2="350" y2="570" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="356" y="574" fill="#6b7280" font-size="12">open stream → subscribe</text>
  <line x1="540" y1="570" x2="570" y2="570" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <text x="576" y="574" fill="#6b7280" font-size="12">QueueClosedEvent</text>
  <line x1="740" y1="570" x2="770" y2="570" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="776" y="574" fill="#6b7280" font-size="12">local enqueue</text>
</svg>
